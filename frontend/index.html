<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codebase Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f2f4f8; color: #111; }
    h1 { margin-bottom: 0.5rem; }
    p { margin: 0.5rem 0; }
    pre { background: #fff; border: 1px solid #d9e2ec; padding: 16px; max-width: 760px; white-space: pre-wrap; word-wrap: break-word; }
    button { padding: 10px 16px; border: none; border-radius: 8px; background: #1570ef; color: #fff; cursor: pointer; }
    button:hover { background: #175cd3; }
  </style>
</head>
<body>
  <h1>Codebase Explorer</h1>
  <p>Фронтенд запущен через nginx.</p>
  <p>Бэкенд доступен по адресу: <code>http://localhost:8000</code></p>
  <p>
    <button id="check-health">Проверить /health</button>
  </p>
  <pre id="result">Нажмите кнопку, чтобы проверить состояние бэкенда.</pre>
  <script>
    const result = document.getElementById('result');
    document.getElementById('check-health').addEventListener('click', async () => {
      result.textContent = 'Запрос к бэкенду...';
      try {
        const response = await fetch('http://localhost:8000/health');
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = `Ошибка запроса: ${error.message}`;
      }
    });
  </script>
</body>
</html>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Все статические файлы с хешем в имени кэшируются надолго
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API проксируется к бэкенду
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличенные таймауты для больших файлов и длительной обработки
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Увеличен максимальный размер тела запроса
        client_max_body_size 500M;
        
        # Отключен буферинг для большых файлов
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SPA: все неизвестные маршруты идут на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
